<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMentor - Adaptive Study Planner</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <h1>EduMentor</h1>
    <p>Your adaptive study planning assistant</p>
</header>

<main>
    <section aria-labelledby="form-heading">
        <h2 id="form-heading">Tell me about your subjects</h2>
        <form id="planner-form">
            <div class="field-group">
                <label for="total-minutes">Total study time available today (minutes)</label>
                <input type="number" id="total-minutes" name="total-minutes" min="10" max="900" value="120" required>
            </div>

            <div id="subjects-container">
                <!-- subject rows get added here -->
            </div>

            <button type="button" id="add-subject-btn" aria-label="Add another subject">+ Add subject</button>
            <button type="submit" id="generate-btn">Generate my study plan</button>
        </form>
        <p id="form-error" role="alert" class="error-text"></p>
    </section>

    <section aria-labelledby="plan-heading">
        <h2 id="plan-heading">Your plan</h2>
        <div id="plan-output" aria-live="polite">
            <p class="placeholder-text">Fill in your subjects and generate a plan to see it here.</p>
        </div>
    </section>
</main>

<template id="subject-row-template">
    <fieldset class="subject-row">
        <legend>Subject</legend>
        <label>
            Name
            <input type="text" class="subj-name" maxlength="50" required>
        </label>
        <label>
            Current marks (%)
            <input type="number" class="subj-marks" min="0" max="100" value="60" required>
        </label>
        <label>
            Difficulty (1-5)
            <input type="number" class="subj-difficulty" min="1" max="5" value="3" required>
        </label>
        <label>
            Days until exam
            <input type="number" class="subj-days" min="0" max="365" value="14" required>
        </label>
        <label class="checkbox-label">
            <input type="checkbox" class="subj-weak">
            I feel weak in this subject
        </label>
        <button type="button" class="remove-subject-btn" aria-label="Remove this subject">Remove</button>
    </fieldset>
</template>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
